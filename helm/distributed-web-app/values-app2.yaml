replicaCount: 2

container:
  name: cdc-consumer-ui

image:
  repository: host.minikube.internal:8082/cdc-consumer-ui
  tag: "8"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

imagePullSecrets:
  - name: nexus-registry

env:
  - name: POSTGRES_HOST
    value: "postgres"

  - name: POSTGRES_PORT
    value: "5432"

  - name: POSTGRES_DB
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_DB

  - name: POSTGRES_USER
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_USER

  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_PASSWORD

  - name: KAFKA_BOOTSTRAP_SERVERS
    value: "my-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"

  - name: KAFKA_TOPIC
    value: "chat-messages"

  - name: KAFKA_GROUP_ID
    value: "app2-chat"