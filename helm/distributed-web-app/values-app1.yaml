replicaCount: 1

secretName: distributed-web-app-secrets

container:
  name: distributed-web-app

image:
  repository: host.minikube.internal:8082/distributed-web-app
  tag: "47"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

imagePullSecrets:
  - name: nexus-registry

aws:
  region: us-east-1

postgres:
  host: postgres
  port: 5432


env:
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"

  - name: DYNAMODB_TABLE
    value: "distributed-processing"

  - name: WORKERS_TABLE
    value: "distributed-workers"

  - name: POSTGRES_HOST
    value: "postgres"

  - name: POSTGRES_PORT
    value: "5432"

  - name: POSTGRES_DB
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_DB

  - name: POSTGRES_USER
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_USER

  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: POSTGRES_PASSWORD