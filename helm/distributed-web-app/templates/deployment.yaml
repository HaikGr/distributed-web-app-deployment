apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}

    spec:
      imagePullSecrets:
       {{- toYaml .Values.imagePullSecrets | nindent 8 }}
       
      containers:

        - name: distributed-web-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: distributed-web-app-secrets

          env:
            - name: AWS_DEFAULT_REGION
              value: "{{ .Values.aws.region }}"

            - name: DYNAMODB_TABLE
              value: "distributed-processing"

            - name: WORKERS_TABLE
              value: "distributed-workers"

            # PostgreSQL

            - name: POSTGRES_HOST
              value: "{{ .Values.postgres.host }}"

            - name: POSTGRES_PORT
              value: "{{ .Values.postgres.port }}"


          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 20