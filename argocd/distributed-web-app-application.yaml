apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: distributed-web-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/HaikGr/distributed-web-app-deployment.git
    targetRevision: main
    path: helm/distributed-web-app
    helm:
      valueFiles:
        - values-app1.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true